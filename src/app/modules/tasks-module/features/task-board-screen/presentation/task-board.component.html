@if (loading()) {
  <app-kanban-skeleton />
} @else if (board(); as current) {
  <app-page-header [title]="current.name" [subtitle]="source === 'project' ? 'Project board' : 'Sprint board'">
    <app-lo-code-display-toggle />
    <a class="text-muted-foreground hover:text-primary text-sm font-semibold" [routerLink]="backLink()">Back to list</a>
    <app-button impact="light" tone="light" size="small" type="button" (buttonClick)="goSheet()">Sheet View</app-button>
    @if (canCreate()) {
      <app-button impact="bold" tone="primary" size="small" type="button" (buttonClick)="openCreate()">New Task</app-button>
    }
  </app-page-header>

  <app-task-board-filters
    [filters]="filters()"
    [users]="current.users"
    [learningObjectives]="scopedObjectives()"
    [learningObjectivesLoading]="learningObjectivesLoading()"
    [userId]="currentUserId()"
    [taskCount]="taskCount()"
    (filtersChange)="onFiltersChange($event)"
    (filtersPanelOpened)="loadFullLearningObjectives()" />

  <div class="flex gap-4 pb-4 max-lg:overflow-x-auto lg:overflow-x-visible">
    @for (column of columns; track column.key) {
      <app-task-column
        [label]="column.label"
        [columnKey]="column.key"
        [cards]="cardsFor(column)"
        [connectedTo]="connectedColumns(column.key)"
        [acceptsFrom]="acceptsFrom(column.key)"
        [dropForbidden]="isDropForbidden(column.key)"
        [totalCount]="totalFor(column)"
        [movingIds]="movingIds()"
        (openCard)="openCard($event)"
        (dragStarted)="onColumnDragStart(column.key)"
        (dragEnded)="onColumnDragEnd($event, column.key)"
        (dropped)="onCardDropped($event, column)" />
    }
  </div>

  @if (showBoardPager()) {
    <div class="flex items-center justify-center gap-3 pb-4">
      <app-button
        impact="light"
        tone="light"
        size="small"
        type="button"
        [disabled]="boardPage() <= 1"
        (buttonClick)="onBoardPage(boardPage() - 1)">
        Prev
      </app-button>
      <span class="text-muted-foreground text-sm">Page {{ boardPage() }} / {{ boardTotalPages() }}</span>
      <app-button
        impact="light"
        tone="light"
        size="small"
        type="button"
        [disabled]="boardPage() >= boardTotalPages()"
        (buttonClick)="onBoardPage(boardPage() + 1)">
        Next
      </app-button>
    </div>
  }

  @if (showCreate()) {
    <app-new-task-modal
      [subjectId]="entityId"
      [learningObjectives]="current.learningObjectives"
      [users]="current.users"
      (closed)="showCreate.set(false)"
      (created)="onCreated()" />
  }
}

@if (selected(); as task) {
  <app-task-drawer
    [task]="task"
    [users]="board()?.users ?? []"
    (closed)="closeDrawer()"
    (changed)="onDrawerChanged()" />
}
