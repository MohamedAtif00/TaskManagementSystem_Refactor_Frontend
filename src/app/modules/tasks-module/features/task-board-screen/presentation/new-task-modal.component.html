<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
  <div class="bg-card border-border w-full max-w-md rounded-xl border p-5 shadow-lg">
    <h3 class="text-foreground mb-4 text-lg font-semibold">New Task</h3>
    <div class="space-y-3">
      @if (useMock) {
        <label class="block">
          <span class="text-muted-foreground mb-1 block text-xs font-medium">Name</span>
          <input type="text" [(ngModel)]="name" name="taskName" />
        </label>
      }
      <label class="block">
        <span class="text-muted-foreground mb-1 block text-xs font-medium">Learning objective</span>
        <select [(ngModel)]="learningObjectiveId" name="loId">
          <option [ngValue]="0">Select</option>
          @for (lo of learningObjectives; track lo.id) {
            <option [ngValue]="lo.id">{{ lo.name }}</option>
          }
        </select>
      </label>
      <label class="block">
        <span class="text-muted-foreground mb-1 block text-xs font-medium">Task bank</span>
        <select [(ngModel)]="taskBankItemId" name="taskBankItemId">
          <option [ngValue]="0">Select</option>
          @for (item of taskBank; track item.id) {
            <option [ngValue]="item.id">{{ item.name }}</option>
          }
        </select>
      </label>
      <label class="block">
        <span class="text-muted-foreground mb-1 block text-xs font-medium">Assignee (optional)</span>
        <select [(ngModel)]="userId" name="userId">
          <option [ngValue]="0">Unassigned</option>
          @for (user of users; track user.id) {
            <option [ngValue]="user.id">{{ user.name }}</option>
          }
        </select>
      </label>
      @if (error) {
        <p class="text-destructive text-xs">{{ error }}</p>
      }
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <app-button impact="light" tone="light" size="small" type="button" (buttonClick)="closed.emit()">Cancel</app-button>
      <app-button impact="bold" tone="primary" size="small" type="button" (buttonClick)="save()">Create</app-button>
    </div>
  </div>
</div>
