<button
  type="button"
  class="bg-card hover:border-primary relative flex w-full items-start gap-2 rounded-lg border p-3 text-left shadow-sm"
  [class.border-border]="!menuActive"
  [class.border-primary]="menuActive"
  [class.ring-2]="menuActive"
  [class.ring-primary]="menuActive"
  [class.bg-primary/10]="menuActive"
  [attr.aria-busy]="moving"
  (click)="onOpen()"
  (contextmenu)="onContextMenu($event)">
  <div class="min-w-0 flex-1">
  <p class="text-foreground mb-1 text-sm font-semibold">{{ card.name }}</p>
  <p class="text-muted-foreground mb-2 text-xs" [title]="card.learningObjective.name">
    {{ card.learningObjective.name | loCodeLabel: loDisplay.view().showMapped : loDisplay.view().direction }}
  </p>
  <p class="text-muted-foreground text-xs">{{ card.user?.name || 'Unassigned' }}</p>
  </div>
  @if (card.priority || card.flagged || card.paused || card.isRollback) {
    <span class="mt-0.5 flex shrink-0 flex-col items-center gap-1">
      @if (card.priority) {
        <span
          class="flex size-4 items-center justify-center text-[11px] font-bold leading-none"
          [title]="priorityLabels[card.priority]"
          [attr.aria-label]="priorityLabels[card.priority]"
          [class.text-red-500]="card.priority === 3"
          [class.text-amber-500]="card.priority === 2"
          [class.text-sky-600]="card.priority === 1">
          {{ card.priority === 3 ? 'H' : card.priority === 2 ? 'M' : 'L' }}
        </span>
      }
      @if (card.flagged) {
        <span class="text-red-500" title="Flagged" aria-label="Flagged">
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M3 2.25a.75.75 0 0 1 .75.75v.54l1.838-.46a9.75 9.75 0 0 1 6.725.738l.108.054a8.25 8.25 0 0 0 5.58.652l3.109-.732a.75.75 0 0 1 .93.706v11.28a.75.75 0 0 1-.57.726l-3.14.74a9.75 9.75 0 0 1-6.725-.738l-.108-.054a8.25 8.25 0 0 0-5.58-.652l-1.838.46V21a.75.75 0 0 1-1.5 0V3A.75.75 0 0 1 3 2.25Z" clip-rule="evenodd" />
          </svg>
        </span>
      }
      @if (card.paused) {
        <span class="text-yellow-600 dark:text-yellow-400" title="Paused" aria-label="Paused">
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12ZM9 8.25a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75h.75a.75.75 0 0 0 .75-.75V9a.75.75 0 0 0-.75-.75H9Zm5.25 0a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75H15a.75.75 0 0 0 .75-.75V9a.75.75 0 0 0-.75-.75h-.75Z" clip-rule="evenodd" />
          </svg>
        </span>
      }
      @if (card.isRollback) {
        <span class="text-red-500 flex items-center gap-0.5" title="Rollback" [attr.aria-label]="'Rollback ' + card.rollbackCount">
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9.53 2.47a.75.75 0 0 1 0 1.06L4.81 8.25H15a6.75 6.75 0 0 1 0 13.5h-3a.75.75 0 0 1 0-1.5h3a5.25 5.25 0 1 0 0-10.5H4.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
          </svg>
          @if (card.rollbackCount) {
            <span class="text-[10px] font-semibold tabular-nums">{{ card.rollbackCount }}</span>
          }
        </span>
      }
    </span>
  }
  @if (moving) {
    <span class="bg-card/75 pointer-events-none absolute inset-0 flex items-center justify-center rounded-lg">
      <span class="border-primary h-5 w-5 animate-spin rounded-full border-2 border-t-transparent"></span>
    </span>
  }
</button>
