<button
  type="button"
  class="bg-card border-border hover:border-primary relative w-full rounded-lg border p-3 text-left shadow-sm"
  [attr.aria-busy]="moving"
  (click)="onOpen()">
  <div class="mb-1 flex items-start justify-between gap-2">
    <p class="text-foreground text-sm font-semibold">{{ card.name }}</p>
    @if (card.priority) {
      <span class="bg-primary/10 text-primary shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase">
        {{ priorityLabels[card.priority] }}
      </span>
    }
  </div>
  <p class="text-muted-foreground mb-2 text-xs" [title]="card.learningObjective.name">
    {{ card.learningObjective.name | loCodeLabel: loDisplay.view().showMapped : loDisplay.view().direction }}
  </p>
  <p class="text-muted-foreground text-xs">{{ card.user?.name || 'Unassigned' }}</p>
  <div class="mt-2 flex flex-wrap gap-1">
    @if (card.flagged) {
      <span class="bg-primary/15 text-primary rounded px-1.5 py-0.5 text-[10px] font-semibold">Flagged</span>
    }
    @if (card.paused) {
      <span class="bg-yellow-500/15 text-yellow-700 dark:text-yellow-400 rounded px-1.5 py-0.5 text-[10px] font-semibold">Paused</span>
    }
    @if (card.isRollback) {
      <span class="bg-primary/15 text-primary rounded px-1.5 py-0.5 text-[10px] font-semibold">Rollback {{ card.rollbackCount }}</span>
    }
  </div>
  @if (moving) {
    <span class="bg-card/75 pointer-events-none absolute inset-0 flex items-center justify-center rounded-lg">
      <span class="border-primary h-5 w-5 animate-spin rounded-full border-2 border-t-transparent"></span>
    </span>
  }
</button>
