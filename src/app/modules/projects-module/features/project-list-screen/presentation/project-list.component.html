<app-page-header title="Projects" subtitle="Year roots and subject counts"></app-page-header>

<div class="mb-4">
  <input
    type="search"
    class="max-w-sm"
    placeholder="Search projects"
    [(ngModel)]="search"
    (ngModelChange)="load()" />
</div>

<div class="border-muted/20 bg-background flex min-w-full flex-col rounded-xl border p-2">
  <div class="scrollbar-thumb-rounded scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted grow overflow-x-auto px-5">
    <table class="text-muted-foreground table w-full table-auto border-collapse border-0 text-left align-middle leading-5">
      <thead class="border-muted/20 text-muted-foreground border text-xs">
        <tr>
          <th class="px-3 py-3">Name</th>
          <th class="px-3 py-3">Description</th>
          <th class="px-3 py-3">Year</th>
          <th class="px-3 py-3">Status</th>
          <th class="px-3 py-3">Subjects</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr class="hover:bg-card/50">
            <td class="text-foreground px-3 py-3 text-sm font-semibold">{{ row.name }}</td>
            <td class="px-3 py-3 text-sm">{{ row.description }}</td>
            <td class="px-3 py-3 text-sm">{{ row.year }}</td>
            <td class="px-3 py-3 text-sm">{{ row.status }}</td>
            <td class="px-3 py-3 text-sm">{{ row.subjectCount }}</td>
          </tr>
        } @empty {
          <tr>
            <td class="py-8 text-center text-sm" colspan="5">No projects found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
