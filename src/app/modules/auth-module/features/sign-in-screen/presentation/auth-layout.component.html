<div class="flex h-screen w-screen">
  <div class="auth-bg bg-primary hidden flex-1 items-center justify-center bg-cover lg:flex">
    <div class="max-w-2xl space-y-4 p-8 text-center text-white">
      <h1 class="text-4xl font-bold">Task Management System</h1>
      <p class="text-sm font-light">
        Sign in with your employee code to manage projects, kanban work, and your team.
      </p>
    </div>
  </div>
  <div class="bg-background flex flex-1 items-center justify-center">
    <div class="border-border/60 bg-card max-w-md overflow-y-auto rounded-xl border px-6 py-8 shadow-sm sm:w-[500px]">
      <div class="flex items-center justify-center gap-3">
        <a class="bg-primary rounded-sm p-2">
          <svg-icon src="assets/icons/logo.svg" [svgClass]="'h-5 w-5'"></svg-icon>
        </a>
        <b class="text-md text-foreground font-bold">TMS</b>
        <span class="text-muted-foreground text-xs">v{{ version }}</span>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
